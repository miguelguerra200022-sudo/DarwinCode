[package]
name = "darwin_cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "darwin_cli"
path = "src/lib.rs"

[[bin]]
name = "darwin_cli"
path = "src/main.rs"

[dependencies]
darwin_core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["full"] }
rand = "0.8"
rayon = "1.10"

