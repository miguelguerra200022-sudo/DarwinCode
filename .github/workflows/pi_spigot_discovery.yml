name: 🧬 DarwinCode Continuous Pi Spigot Miner

on:
  schedule:
    # Ejecuta automáticamente cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub en cualquier momento
  push:
    paths:
      - '.github/workflows/pi_spigot_discovery.yml'

permissions:
  contents: write

jobs:
  mine-pi-spigot:
    name: 🚀 Minero Neuro-Simbólico de Pi (5.5h)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear Compilación de Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-pi-miner-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pi-miner-

      - name: Compilar Binario Optimizado en Release
        run: cargo build --release --bin darwin_cli

      - name: Ejecutar Minería Autónoma de Pi con Sincronización en Vivo (5.5 Horas)
        run: |
          git config --global user.name "DarwinCode Scientific Engine"
          git config --global user.email "darwin-engine@users.noreply.github.com"

          # Monitor en segundo plano: sincroniza descubrimientos a GitHub en tiempo real cada 120 segundos
          (while true; do
            sleep 120
            if [ -f PI_SPIGOT_DISCOVERIES.txt ]; then
              git add PI_SPIGOT_DISCOVERIES.txt
              if ! git diff --staged --quiet; then
                git commit -m "feat(discovery): live update Pi Spigot records [skip ci]" || true
                for i in {1..5}; do
                  git pull --rebase origin main && git push && break || sleep 5
                done
              fi
            fi
          done) &
          SYNC_PID=$!

          # 19,800 segundos = 5.5 horas (respetando el límite de 6h de GitHub)
          ./target/release/darwin_cli --mine-pi-spigot --duration-secs 19800 --output PI_SPIGOT_DISCOVERIES.txt

          # Detener monitor y realizar commit final garantizado
          kill $SYNC_PID || true
          git add PI_SPIGOT_DISCOVERIES.txt
          if ! git diff --staged --quiet; then
            git commit -m "feat(discovery): final Pi Spigot session records [skip ci]" || true
            for i in {1..5}; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi
